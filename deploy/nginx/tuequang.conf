# Nginx reverse-proxy configuration for the Tuệ Quang Shelter website.
#
# Install on a server:
#   sudo cp deploy/nginx/tuequang.conf /etc/nginx/sites-available/tuequang
#   sudo ln -s /etc/nginx/sites-available/tuequang /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace the placeholders (server_name and the static file path) with your
# real values.

upstream tuequang_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain, e.g. "server_name tuequang.org www.tuequang.org;"
    # Use "_" to accept any host (useful for local/IP testing without a domain).
    server_name _;

    # Allow file uploads / large form posts up to 5 MB.
    client_max_body_size 5M;

    # Serve static assets directly from Nginx (fast, no Python involved).
    # Point this at the absolute path of the project's static/ folder.
    location /static/ {
        alias /opt/orphanage_website/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Everything else is proxied to Gunicorn.
    location / {
        proxy_pass http://tuequang_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
